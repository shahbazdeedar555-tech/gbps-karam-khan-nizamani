<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Reports | GBPS Karam Khan Nizamani</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f6f9;
            color: #222;
        }

        header {
            background: #006a4e;
            color: white;
            padding: 18px 15px;
            text-align: center;
        }

        header h1 {
            font-size: 22px;
        }

        header p {
            margin-top: 6px;
            font-size: 14px;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 15px;
        }

        .back {
            display: inline-block;
            margin-bottom: 15px;
            color: #006a4e;
            text-decoration: none;
            font-weight: bold;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .box h2 {
            color: #006a4e;
            margin-bottom: 15px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .summary-card {
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            background: #f2f6f9;
        }

        .summary-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #006a4e;
        }

        .summary-card p {
            margin-top: 5px;
            font-size: 13px;
            color: #666;
        }

        .filter {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .filter input,
        .filter select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        .filter button {
            background: #006a4e;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            background: #006a4e;
            color: white;
            padding: 11px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .present {
            color: #2e7d32;
            font-weight: bold;
        }

        .absent {
            color: #c62828;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        .clear-btn {
            margin-top: 15px;
            background: #c62828;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            background: #006a4e;
            color: white;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h1>🏫 GBPS Karam Khan Nizamani</h1>
    <p>Attendance Reports</p>
</header>

<div class="container">

    <a href="admin-dashboard.html" class="back">
        ← Back to Admin Dashboard
    </a>

    <div class="box">

        <h2>📊 Attendance Summary</h2>

        <div class="summary">

            <div class="summary-card">
                <div class="number" id="totalRecords">0</div>
                <p>Total Records</p>
            </div>

            <div class="summary-card">
                <div class="number" id="presentCount">0</div>
                <p>Present</p>
            </div>

            <div class="summary-card">
                <div class="number" id="absentCount">0</div>
                <p>Absent</p>
            </div>

            <div class="summary-card">
                <div class="number" id="attendancePercentage">0%</div>
                <p>Attendance Rate</p>
            </div>

        </div>

    </div>

    <div class="box">

        <h2>🔎 Filter Report</h2>

        <div class="filter">

            <input
                type="date"
                id="dateFilter"
            >

            <select id="classFilter">
                <option value="">All Classes</option>
                <option value="KG">KG</option>
                <option value="Class 1">Class 1</option>
                <option value="Class 2">Class 2</option>
                <option value="Class 3">Class 3</option>
                <option value="Class 4">Class 4</option>
                <option value="Class 5">Class 5</option>
            </select>

            <button onclick="loadReport()">
                🔍 Search
            </button>

        </div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student</th>
                        <th>Class</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="reportTable">
                </tbody>

            </table>

        </div>

        <div id="emptyMessage" class="empty">
            No attendance records found.
        </div>

        <button class="clear-btn" onclick="clearReports()">
            🗑 Clear Attendance Records
        </button>

    </div>

</div>

<footer>
    © 2026 GBPS Karam Khan Nizamani Campus
</footer>

<script>

    /*
       Attendance records are expected to be stored
       in localStorage under the key:
       "attendanceRecords"
    */

    function getAttendanceRecords() {

        return JSON.parse(
            localStorage.getItem("attendanceRecords")
        ) || [];

    }


    function loadReport() {

        const records = getAttendanceRecords();

        const selectedDate =
            document.getElementById("dateFilter").value;

        const selectedClass =
            document.getElementById("classFilter").value;

        const filteredRecords = records.filter(function(record) {

            const dateMatch =
                !selectedDate ||
                record.date === selectedDate;

            const classMatch =
                !selectedClass ||
                record.className === selectedClass;

            return dateMatch && classMatch;

        });

        displayReport(filteredRecords);

    }


    function displayReport(records) {

        const table =
            document.getElementById("reportTable");

        const emptyMessage =
            document.getElementById("emptyMessage");

        table.innerHTML = "";

        let present = 0;
        let absent = 0;

        if (records.length === 0) {

            emptyMessage.style.display = "block";

        } else {

            emptyMessage.style.display = "none";

            records.forEach(function(record, index) {

                if (record.status === "Present") {
                    present++;
                }

                if (record.status === "Absent") {
                    absent++;
                }

                const row =
                    document.createElement("tr");

                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${record.studentName || "-"}</td>
                    <td>${record.className || "-"}</td>
                    <td>${record.date || "-"}</td>
                    <td class="${
                        record.status === "Present"
                        ? "present"
                        : "absent"
                    }">
                        ${record.status || "-"}
                    </td>
                `;

                table.appendChild(row);

            });

        }

        const total = records.length;

        const percentage =
            total > 0
            ? Math.round((present / total) * 100)
            : 0;

        document.getElementById("totalRecords").textContent =
            total;

        document.getElementById("presentCount").textContent =
            present;

        document.getElementById("absentCount").textContent =
            absent;

        document.getElementById("attendancePercentage").textContent =
            percentage + "%";

    }


    function clearReports() {

        const confirmDelete = confirm(
            "Are you sure you want to delete ALL attendance records?"
        );

        if (confirmDelete) {

            localStorage.removeItem("attendanceRecords");

            loadReport();

            alert("All attendance records have been cleared.");

        }

    }


    loadReport();

</script>

</body>
</html>
