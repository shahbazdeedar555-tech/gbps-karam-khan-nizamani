
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students Portal - GBPS Karam Khan Nizamani</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6f9;
            color: #222;
        }

        header {
            background: #0b5d3b;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 15px;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .portal-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
        }

        .portal-card h2 {
            text-align: center;
            margin-top: 0;
            color: #0b5d3b;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0b5d3b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #08482e;
        }

        #studentResult {
            display: none;
            margin-top: 25px;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .student-info {
            background: #f7faf8;
            padding: 18px;
            border-radius: 10px;
        }

        .student-info p {
            margin: 10px 0;
            font-size: 16px;
        }

        .student-info strong {
            color: #0b5d3b;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px 10px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 GBPS Karam Khan Nizamani</h1>
    <p>Students Portal</p>
</header>

<div class="container">

    <div class="portal-card">

        <h2>Student Search</h2>

        <label for="grNo">Enter GR No.</label>

        <input
            type="text"
            id="grNo"
            placeholder="Enter student's GR No."
        >

        <button onclick="searchStudent()">
            🔍 Search Student
        </button>

        <div id="message"></div>

        <div id="studentResult">

            <h2>Student Information</h2>

            <div class="student-info">

                <p>
                    <strong>GR No.:</strong>
                    <span id="studentGR"></span>
                </p>

                <p>
                    <strong>Student Name:</strong>
                    <span id="studentName"></span>
                </p>

                <p>
                    <strong>Father's Name:</strong>
                    <span id="fatherName"></span>
                </p>

                <p>
                    <strong>Class:</strong>
                    <span id="studentClass"></span>
                </p>

                <p>
                    <strong>Roll Number:</strong>
                    <span id="rollNumber"></span>
                </p>

                <p>
                    <strong>Date of Birth:</strong>
                    <span id="dateOfBirth"></span>
                </p>

            </div>

        </div>

    </div>

</div>

<footer>
    © 2026 GBPS Karam Khan Nizamani
</footer>


<!-- Firebase -->

<script type="module">

    import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getDatabase,
        ref,
        get
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    // ==============================
    // FIREBASE CONFIGURATION
    // ==============================

    const firebaseConfig = {

        apiKey:
            "AIzaSyBoTtizM_SfChAAhvjmZloB-j5wCKLH4Ps",

        authDomain:
            "gbps-karam-khan-nizamani.firebaseapp.com",

        databaseURL:
            "https://gbps-karam-khan-nizamani-default-rtdb.firebaseio.com",

        projectId:
            "gbps-karam-khan-nizamani",

        storageBucket:
            "gbps-karam-khan-nizamani.firebasestorage.app",

        messagingSenderId:
            "772460890400",

        appId:
            "1:772460890400:web:cf2379f4e0d21ebe476f45",

        measurementId:
            "G-KDQ1MQ16WN"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    // ==============================
    // STUDENT SEARCH
    // ==============================

    window.searchStudent = async function () {

        const grNo =
            document.getElementById("grNo")
                .value
                .trim();

        const message =
            document.getElementById("message");

        const result =
            document.getElementById("studentResult");


        // Hide old result
        result.style.display = "none";


        // Clear message
        message.textContent = "";


        // Check empty GR number
        if (grNo === "") {

            message.textContent =
                "Please enter a GR No.";

            message.style.color = "red";

            return;
        }


        message.textContent =
            "Searching...";

        message.style.color =
            "#0b5d3b";


        try {

            // Read Firebase database root
            const snapshot =
                await get(ref(database));


            if (!snapshot.exists()) {

                message.textContent =
                    "No data found in Firebase.";

                message.style.color =
                    "red";

                return;
            }


            const data =
                snapshot.val();


            let foundStudent = null;


            // ==============================
            // SEARCH ALL ROOT RECORDS
            // ==============================

            Object.keys(data).forEach(key => {

                const record =
                    data[key];


                // Ignore non-student nodes
                if (
                    !record ||
                    typeof record !== "object" ||
                    Array.isArray(record)
                ) {
                    return;
                }


                // Check actual field used
                if (
                    record.grNumber !== undefined &&
                    String(record.grNumber)
                        .trim()
                        .toLowerCase() ===
                    grNo.toLowerCase()
                ) {

                    foundStudent = record;

                }

            });


            // ==============================
            // STUDENT NOT FOUND
            // ==============================

            if (!foundStudent) {

                message.textContent =
                    "Student not found.";

                message.style.color =
                    "red";

                return;
            }


            // ==============================
            // DISPLAY STUDENT
            // ==============================

            document.getElementById("studentGR")
                .textContent =
                foundStudent.grNumber || "—";


            document.getElementById("studentName")
                .textContent =
                foundStudent.name || "—";


            document.getElementById("fatherName")
                .textContent =
                foundStudent.father || "—";


            document.getElementById("studentClass")
                .textContent =
                foundStudent.className || "—";


            document.getElementById("rollNumber")
                .textContent =
                foundStudent.roll || "—";


            document.getElementById("dateOfBirth")
                .textContent =
                foundStudent.dateOfBirth || "—";


            // Show result
            result.style.display =
                "block";


            message.textContent =
                "Student found successfully.";

            message.style.color =
                "#0b5d3b";

        }


        catch (error) {

            console.error(
                "Firebase Error:",
                error
            );


            message.textContent =
                "Unable to connect to Firebase.";

            message.style.color =
                "red";

        }

    };


    // ==============================
    // ENTER KEY SEARCH
    // ==============================

    document.getElementById("grNo")
        .addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {

                    window.searchStudent();

                }

            }
        );

</script>

</body>
</html>
